<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel</title>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; padding: 15px; }
        .header { text-align: center; padding: 15px 0; border-bottom: 1px solid #30363d; margin-bottom: 20px; }
        .header h1 { font-size: 20px; color: #58a6ff; }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; background: #161b22; border-radius: 10px; padding: 4px; }
        .tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; font-size: 13px; color: #8b949e; }
        .tab.active { background: #238636; color: white; }
        .msg { padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 15px; display: none; }
        .msg-ok { background: rgba(35,134,54,0.3); color: #3fb950; }
        .msg-err { background: rgba(218,54,51,0.3); color: #f85149; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #8b949e; }
        .form-group input { width: 100%; padding: 12px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; font-size: 16px; outline: none; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn:active { transform: scale(0.97); }
        .btn-blue { background: #238636; color: white; }
        .btn-yellow { background: #d2991d; color: black; }
        .btn-red { background: #da3633; color: white; }
        .btn-gray { background: #1f6feb; color: white; }
        .list { display: flex; flex-direction: column; gap: 8px; }
        .item { background: #161b22; border-radius: 10px; padding: 12px; border-left: 3px solid #58a6ff; }
        .item .iname { font-weight: bold; }
        .item .imeta { font-size: 11px; color: #8b949e; }
        .item .iactions { display: flex; gap: 8px; margin-top: 8px; }
        .item .iactions button { flex: 1; padding: 7px; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .btn-e { background: #d2991d; color: black; }
        .btn-d { background: #da3633; color: white; }
        .empty { text-align: center; padding: 40px; color: #8b949e; }
        .search-box { background: #161b22; border-radius: 8px; padding: 10px; margin-bottom: 15px; display: flex; gap: 8px; }
        .search-box input { flex: 1; background: transparent; border: none; color: #c9d1d9; font-size: 14px; outline: none; }
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .scard { background: #161b22; border-radius: 10px; padding: 12px; text-align: center; }
        .scard .val { font-size: 22px; font-weight: bold; color: #58a6ff; }
        .scard .lbl { font-size: 11px; color: #8b949e; }
    </style>
</head>
<body>
    <div class="header"><h1>🔧 Admin Panel</h1></div>
    <div class="msg msg-ok" id="msgOk"></div>
    <div class="msg msg-err" id="msgErr"></div>
    
    <div class="tabs">
        <div class="tab active" onclick="switchTab('add')">➕ ထည့်ရန်</div>
        <div class="tab" onclick="switchTab('edit')">✏️ ပြင်ရန်</div>
        <div class="tab" onclick="switchTab('list')">📋 စာရင်း</div>
        <div class="tab" onclick="switchTab('stats')">📊 အင်း</div>
    </div>
    
    <div id="tab-add">
        <div class="form-group"><label>🏍️ အမည်</label><input type="text" id="addName" placeholder="Wave 125i"></div>
        <div class="form-group"><label>🏷️ Brand</label><input type="text" id="addBrand" placeholder="Honda"></div>
        <div class="form-row">
            <div class="form-group"><label>💰 ဈေး</label><input type="number" id="addPrice" placeholder="2500000"></div>
            <div class="form-group"><label>📦 လက်ကျန်</label><input type="number" id="addStock" placeholder="10"></div>
        </div>
        <div class="form-group"><label>📂 အမျိုးအစား</label><input type="text" id="addCategory" placeholder="Scooter"></div>
        <div class="form-group"><label>🖼️ ပုံ URL</label><input type="text" id="addImage" placeholder="https://..."></div>
        <button class="btn btn-blue" onclick="addBike()">✅ ထည့်မည်</button>
    </div>
    
    <div id="tab-edit" style="display:none;">
        <div class="form-group"><label>🆔 ID</label><input type="text" id="editId" placeholder="ID" onchange="loadBike()"></div>
        <div id="editForm" style="display:none;">
            <div class="form-group"><label>🏍️ အမည်</label><input type="text" id="editName"></div>
            <div class="form-group"><label>🏷️ Brand</label><input type="text" id="editBrand"></div>
            <div class="form-row">
                <div class="form-group"><label>💰 ဈေး</label><input type="number" id="editPrice"></div>
                <div class="form-group"><label>📦 လက်ကျန်</label><input type="number" id="editStock"></div>
            </div>
            <div class="form-group"><label>📂 အမျိုးအစား</label><input type="text" id="editCategory"></div>
            <div class="form-group"><label>🖼️ ပုံ URL</label><input type="text" id="editImage"></div>
            <button class="btn btn-yellow" onclick="updateBike()">💾 သိမ်းမည်</button>
            <button class="btn btn-red" onclick="deleteBike()">🗑️ ဖျက်မည်</button>
        </div>
    </div>
    
    <div id="tab-list" style="display:none;">
        <div class="search-box"><span>🔍</span><input type="text" id="listSearch" placeholder="ရှာ..." oninput="renderList()"></div>
        <div class="list" id="bikeList"></div>
        <div class="empty" id="emptyList"><p>📭 မရှိပါ</p></div>
    </div>
    
    <div id="tab-stats" style="display:none;">
        <div class="stats" id="statsRow"></div>
        <button class="btn btn-gray" onclick="loadAll()">🔄 Refresh</button>
    </div>

    <script>
        let allBikes = [];
        let sha = '';
        
        function msg(t, m) {
            document.getElementById('msgOk').style.display = 'none';
            document.getElementById('msgErr').style.display = 'none';
            if (t === 'ok') {
                document.getElementById('msgOk').textContent = '✅ ' + m;
                document.getElementById('msgOk').style.display = 'block';
                setTimeout(() => document.getElementById('msgOk').style.display = 'none', 3000);
            } else {
                document.getElementById('msgErr').textContent = '❌ ' + m;
                document.getElementById('msgErr').style.display = 'block';
            }
        }
        
        async function loadAll() {
            try {
                let res = await fetch(CONFIG.API_URL, {
                    headers: { 'Authorization': 'token ' + CONFIG.GITHUB_TOKEN }
                });
                if (res.ok) {
                    const d = await res.json();
                    sha = d.sha;
                    allBikes = JSON.parse(atob(d.content)).motorcycles || [];
                } else {
                    res = await fetch(CONFIG.RAW_URL + '?t=' + Date.now());
                    const d = await res.json();
                    allBikes = d.motorcycles || [];
                }
                if (document.getElementById('tab-list').style.display !== 'none') renderList();
                if (document.getElementById('tab-stats').style.display !== 'none') renderStats();
            } catch(e) {
                msg('err', 'ဒေတာမရပါ');
            }
        }
        
        async function save(data) {
            const res = await fetch(CONFIG.API_URL, {
                method: 'PUT',
                headers: {
                    'Authorization': 'token ' + CONFIG.GITHUB_TOKEN,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: 'Update',
                    content: btoa(unescape(encodeURIComponent(JSON.stringify({ motorcycles: data }, null, 2)))),
                    sha: sha
                })
            });
            if (!res.ok) throw new Error('Fail');
            const r = await res.json();
            sha = r.content.sha;
        }
        
        function switchTab(t) {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            ['tab-add','tab-edit','tab-list','tab-stats'].forEach(id => document.getElementById(id).style.display='none');
            if(t==='add'){document.getElementById('tab-add').style.display='block';document.querySelectorAll('.tab')[0].classList.add('active')}
            if(t==='edit'){document.getElementById('tab-edit').style.display='block';document.querySelectorAll('.tab')[1].classList.add('active')}
            if(t==='list'){document.getElementById('tab-list').style.display='block';document.querySelectorAll('.tab')[2].classList.add('active');renderList()}
            if(t==='stats'){document.getElementById('tab-stats').style.display='block';document.querySelectorAll('.tab')[3].classList.add('active');renderStats()}
        }
        
        async function addBike() {
            const n = document.getElementById('addName').value.trim();
            const b = document.getElementById('addBrand').value.trim();
            const p = parseInt(document.getElementById('addPrice').value);
            const s = parseInt(document.getElementById('addStock').value);
            const c = document.getElementById('addCategory').value.trim();
            const im = document.getElementById('addImage').value.trim();
            if(!n||!b||!p||isNaN(s)||!c){msg('err','အားလုံးဖြည့်ပါ');return}
            allBikes.push({id:Date.now().toString(),name:n,brand:b,price:p,stock:s,category:c,image:im});
            try{await save(allBikes);msg('ok',n+' ထည့်ပြီး!');['addName','addBrand','addPrice','addStock','addCategory','addImage'].forEach(id=>document.getElementById(id).value='')}
            catch(e){msg('err','မရပါ');allBikes.pop()}
        }
        
        function loadBike() {
            const id = document.getElementById('editId').value.trim();
            const bike = allBikes.find(b => b.id === id);
            if(bike){
                document.getElementById('editForm').style.display='block';
                document.getElementById('editName').value=bike.name;
                document.getElementById('editBrand').value=bike.brand;
                document.getElementById('editPrice').value=bike.price;
                document.getElementById('editStock').value=bike.stock;
                document.getElementById('editCategory').value=bike.category;
                document.getElementById('editImage').value=bike.image||'';
            }else{document.getElementById('editForm').style.display='none';if(id)msg('err','မရှိပါ')}
        }
        
        async function updateBike() {
            const id = document.getElementById('editId').value.trim();
            const bike = allBikes.find(b => b.id === id);
            if(!bike){msg('err','မရှိပါ');return}
            bike.name=document.getElementById('editName').value.trim();
            bike.brand=document.getElementById('editBrand').value.trim();
            bike.price=parseInt(document.getElementById('editPrice').value);
            bike.stock=parseInt(document.getElementById('editStock').value);
            bike.category=document.getElementById('editCategory').value.trim();
            bike.image=document.getElementById('editImage').value.trim();
            try{await save(allBikes);msg('ok','ပြင်ပြီး!')}catch(e){msg('err','မရပါ')}
        }
        
        async function deleteBike() {
            const id = document.getElementById('editId').value.trim();
            if(!confirm('ဖျက်မှာလား?'))return;
            allBikes=allBikes.filter(b=>b.id!==id);
            try{await save(allBikes);msg('ok','ဖျက်ပြီး!');document.getElementById('editForm').style.display='none';document.getElementById('editId').value=''}
            catch(e){msg('err','မရပါ');loadAll()}
        }
        
        function renderList() {
            const s = document.getElementById('listSearch').value.toLowerCase();
            let f = s ? allBikes.filter(b=>(b.name||'').toLowerCase().includes(s)||(b.brand||'').toLowerCase().includes(s)||b.id.includes(s)) : allBikes;
            if(f.length===0){document.getElementById('bikeList').innerHTML='';document.getElementById('emptyList').style.display='block';return}
            document.getElementById('emptyList').style.display='none';
            document.getElementById('bikeList').innerHTML = f.map(b =>
                '<div class="item"><div class="iname">'+b.name+'</div><div class="imeta">'+b.brand+' | 📂 '+b.category+' | 💰 '+parseInt(b.price).toLocaleString()+' | 📦 '+b.stock+'</div><div class="imeta">🆔 '+b.id+'</div><div class="iactions"><button class="btn-e" onclick="editFromList(\''+b.id+'\')">✏️</button><button class="btn-d" onclick="delFromList(\''+b.id+'\')">🗑️</button></div></div>'
            ).join('');
        }
        
        function editFromList(id){document.getElementById('editId').value=id;loadBike();switchTab('edit')}
        async function delFromList(id){if(!confirm('ဖျက်မှာလား?'))return;allBikes=allBikes.filter(b=>b.id!==id);try{await save(allBikes);msg('ok','ဖျက်ပြီး!');renderList()}catch(e){msg('err','မရပါ');loadAll()}}
        
        function renderStats(){
            document.getElementById('statsRow').innerHTML =
                '<div class="scard"><div class="val">'+allBikes.length+'</div><div class="lbl">အမျိုးအစား</div></div>'+
                '<div class="scard"><div class="val">'+allBikes.reduce((s,b)=>s+parseInt(b.stock||0),0)+'</div><div class="lbl">လက်ကျန်</div></div>'+
                '<div class="scard"><div class="val">'+allBikes.reduce((s,b)=>s+(parseInt(b.price||0)*parseInt(b.stock||0)),0).toLocaleString()+'</div><div class="lbl">တန်ဖိုး</div></div>'+
                '<div class="scard"><div class="val">'+allBikes.filter(b=>parseInt(b.stock||0)===0).length+'</div><div class="lbl">ကုန်သွား</div></div>';
        }
        
        loadAll();
    </script>
</body>
</html>
