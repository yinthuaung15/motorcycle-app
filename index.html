<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motorcycle Price</title>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #1a1a2e; color: #fff; padding: 15px; min-height: 100vh; }
        .header { text-align: center; padding: 20px 0; border-bottom: 1px solid #333; margin-bottom: 15px; }
        .header h1 { font-size: 22px; color: #00b894; }
        .search-box { background: #16213e; border-radius: 12px; padding: 12px; margin-bottom: 15px; display: flex; gap: 10px; }
        .search-box input { flex: 1; background: transparent; border: none; color: #fff; font-size: 16px; outline: none; }
        .filter-row { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; }
        .filter-btn { padding: 7px 14px; border-radius: 20px; border: 1px solid #00b894; background: transparent; color: #00b894; font-size: 12px; white-space: nowrap; cursor: pointer; }
        .filter-btn.active { background: #00b894; color: #fff; }
        .bike-list { display: flex; flex-direction: column; gap: 12px; }
        .bike-card { background: #16213e; border-radius: 15px; padding: 12px; border-left: 4px solid #00b894; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .bike-card:active { transform: scale(0.98); }
        .bike-card .bike-img { width: 70px; height: 70px; border-radius: 12px; object-fit: cover; background: #0f3460; }
        .bike-card .bike-info { flex: 1; }
        .bike-card .brand { font-size: 11px; color: #888; text-transform: uppercase; }
        .bike-card .name { font-size: 16px; font-weight: bold; margin: 4px 0; }
        .bike-card .info-row { display: flex; justify-content: space-between; align-items: center; }
        .bike-card .price { font-size: 16px; font-weight: bold; color: #00b894; }
        .bike-card .stock { font-size: 11px; padding: 4px 8px; border-radius: 12px; }
        .stock-yes { background: rgba(0,184,148,0.2); color: #00b894; }
        .stock-no { background: rgba(255,99,72,0.2); color: #ff6348; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal.show { display: flex; }
        .modal-box { background: #1a1a2e; border-radius: 20px; width: 100%; max-width: 400px; overflow: hidden; text-align: center; }
        .modal-box img { width: 100%; height: 220px; object-fit: cover; background: #0f3460; }
        .modal-body { padding: 20px; }
        .modal-body h2 { font-size: 22px; }
        .modal-body .m-brand { color: #888; font-size: 13px; margin: 5px 0 15px; }
        .modal-body .m-price { font-size: 34px; font-weight: bold; color: #00b894; margin: 15px 0; }
        .close-btn { margin-top: 15px; padding: 12px 40px; border-radius: 25px; border: none; background: #00b894; color: #fff; font-size: 16px; cursor: pointer; }
        .loading { text-align: center; padding: 50px; color: #888; }
        .empty { text-align: center; padding: 60px; color: #888; display: none; }
    </style>
</head>
<body>

    <div class="header"><h1>🏍️ ဆိုင်ကယ်ဈေးနှုန်း</h1></div>
    
    <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="ရှာဖွေရန်..." oninput="filterBikes()">
    </div>
    
    <div class="filter-row" id="filterRow"></div>
    <div class="loading" id="loadingDiv"><p>⏳ Loading...</p></div>
    <div class="bike-list" id="bikeList" style="display:none;"></div>
    <div class="empty" id="emptyState"><p>📭 ဆိုင်ကယ်မရှိသေးပါ</p></div>
    
    <div class="modal" id="detailModal" onclick="closeDetail(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <img id="modalImage" src="">
            <div class="modal-body" id="modalContent"></div>
        </div>
    </div>

    <script>
        let allBikes = [];
        let allCategories = [];
        let currentCategory = 'all';
        
        async function loadData() {
            document.getElementById('loadingDiv').style.display = 'block';
            document.getElementById('bikeList').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';
            
            try {
                // Try API first
                let res = await fetch(CONFIG.API_URL, {
                    headers: { 'Authorization': 'token ' + CONFIG.GITHUB_TOKEN }
                });
                
                let data;
                if (res.ok) {
                    const apiData = await res.json();
                    data = JSON.parse(atob(apiData.content));
                } else {
                    // Fallback to Raw URL
                    res = await fetch(CONFIG.RAW_URL + '?t=' + Date.now());
                    data = await res.json();
                }
                
                allBikes = data.motorcycles || [];
                
                // Get categories
                const cats = new Set();
                allBikes.forEach(b => { if (b.category) cats.add(b.category); });
                allCategories = Array.from(cats).sort();
                
                document.getElementById('loadingDiv').style.display = 'none';
                
                if (allBikes.length === 0) {
                    document.getElementById('emptyState').style.display = 'block';
                } else {
                    document.getElementById('bikeList').style.display = 'flex';
                    renderFilters();
                    renderBikes(allBikes);
                }
            } catch (e) {
                document.getElementById('loadingDiv').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('emptyState').innerHTML = '<p>❌ ဒေတာမရပါ</p>';
            }
        }
        
        function renderFilters() {
            let html = '<button class="filter-btn active" onclick="setCategory(\'all\')">🏍️ အားလုံး</button>';
            allCategories.forEach(cat => {
                html += '<button class="filter-btn" onclick="setCategory(\'' + cat + '\')">📂 ' + cat + '</button>';
            });
            document.getElementById('filterRow').innerHTML = html;
        }
        
        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            filterBikes();
        }
        
        function filterBikes() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allBikes;
            if (currentCategory !== 'all') filtered = filtered.filter(b => b.category === currentCategory);
            if (search) filtered = filtered.filter(b => (b.name||'').toLowerCase().includes(search) || (b.brand||'').toLowerCase().includes(search));
            renderBikes(filtered);
        }
        
        function renderBikes(bikes) {
            const list = document.getElementById('bikeList');
            if (!bikes || bikes.length === 0) { list.innerHTML = ''; return; }
            
            list.innerHTML = bikes.map(bike => {
                const avail = parseInt(bike.stock) > 0;
                const img = bike.image || '';
                return '<div class="bike-card" onclick="showDetail(\'' + bike.id + '\')">' +
                    (img ? '<img class="bike-img" src="' + img + '" onerror="this.style.display=\'none\'">' : '') +
                    '<div class="bike-info">' +
                        '<div class="brand">' + (bike.brand||'') + '</div>' +
                        '<div class="name">' + (bike.name||'') + '</div>' +
                        '<div class="info-row">' +
                            '<span class="price">' + parseInt(bike.price).toLocaleString() + ' ကျပ်</span>' +
                            '<span class="stock ' + (avail ? 'stock-yes' : 'stock-no') + '">' + (avail ? '✅ ရှိသည်' : '❌ မရှိပါ') + '</span>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }
        
        function showDetail(id) {
            const bike = allBikes.find(b => b.id == id);
            if (!bike) return;
            const avail = parseInt(bike.stock) > 0;
            
            document.getElementById('modalImage').src = bike.image || '';
            document.getElementById('modalContent').innerHTML =
                '<h2>🏍️ ' + bike.name + '</h2>' +
                '<p class="m-brand">' + bike.brand + ' | 📂 ' + bike.category + '</p>' +
                '<div class="m-price">' + parseInt(bike.price).toLocaleString() + ' ကျပ်</div>' +
                '<p style="color:' + (avail ? '#00b894' : '#ff6348') + ';">📦 လက်ကျန်: ' + (avail ? '🟢 ရှိသည်' : '🔴 မရှိပါ') + '</p>' +
                '<button class="close-btn" onclick="closeDetail()">✕ ပိတ်မည်</button>';
            
            document.getElementById('detailModal').classList.add('show');
        }
        
        function closeDetail(e) {
            if (e && e.target !== document.getElementById('detailModal')) return;
            document.getElementById('detailModal').classList.remove('show');
        }
        
        loadData();
    </script>
</body>
</html>
